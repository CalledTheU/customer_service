slots:
  leave_reason:
    type: text
    label: 请假事由
    description: 用户要申请请假的事由

  leave_days:
    type: text
    label: 请假天数
    description: 用户申请请假的天数

flows:
  leave_request:
    name: 请假申请
    description: 收集请假事由和请假天数，提交请假申请。
    slots:
      - leave_reason
      - leave_days
    steps:
      - id: start
        type: start
        description: 流程入口
        next: ask_leave_reason

      - id: ask_leave_reason
        type: collect
        description: 收集请假事由
        slot_name: leave_reason
        template:
          mode: static
          text: "请说明一下请假事由。"
        validation:
          condition: "slots.get('leave_reason')"
          failure_template:
            mode: static
            text: "请假事由不能为空，请重新输入。"
        next: ask_leave_days

      - id: ask_leave_days
        type: collect
        description: 收集请假天数
        slot_name: leave_days
        template:
          mode: static
          text: "请告诉我请假天数。"
        next:
          - if: "slots.get('leave_days')"
            then: submit_leave
          - else: ask_leave_days

      - id: submit_leave
        type: action
        description: 提交请假申请并回复用户
        action: action_response
        args:
          mode: static
          text: "好的，你的请假申请已提交，事由是{{ slots.leave_reason }}，请假{{ slots.leave_days }}天。"
        next: end

      - id: end
        type: end
        description: 流程结束
        next: []
