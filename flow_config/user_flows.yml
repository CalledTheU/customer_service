slots:
  flow_number:
    type: text
    label: 流程单号
    description: 协同平台中流程（审批单）的单号，例如 QJ20260901001

  flow_status:
    type: text
    label: 流程状态
    description: 流程当前的处理状态，例如审批中、已通过、已驳回

  flow_summary:
    type: text
    label: 流程摘要
    description: 流程的处理摘要信息

  node_name:
    type: text
    label: 当前节点
    description: 流程当前所处的审批节点名称

  approver:
    type: text
    label: 当前审批人
    description: 流程当前节点的审批人姓名

  approval_progress:
    type: text
    label: 审批进度
    description: 流程的审批进度描述

  form_id:
    type: text
    label: 表单ID
    description: 当前咨询表单的唯一标识

  leave_reason:
    type: text
    label: 请假事由
    description: 申请请假的事由

  leave_days:
    type: text
    label: 请假天数
    description: 本次申请请假的天数

  seal_reason:
    type: text
    label: 用章事由
    description: 申请用章的事由

  form_code:
    type: text
    label: 表单编号
    description: 表单的编号，用于用章申请时指定

  seal_result:
    type: text
    label: 用章申请结果
    description: 用章申请提交后的结果展示文本

flows:
  onboarding:
    name: 欢迎引导
    description: 在聊天窗口初次打开时欢迎用户，并介绍助手可处理的协同办公服务。这个 flow 通常由系统主动触发。
    steps:
      - id: start
        type: start
        next: respond

      - id: respond
        type: response
        template:
          text: "你好，这里是协同办公智能助手。我可以帮你查流程状态、查审批进度、发起请假申请或用章申请。"
        next: end

      - id: end
        type: end
        next: []

  flow_status_query:
    name: 流程状态查询
    description: 帮用户查询审批流程当前的处理状态，例如审批中、已通过或已驳回。
    steps:
      - id: start
        type: start
        next: ask_flow_number

      - id: ask_flow_number
        type: collect
        slot_name: flow_number
        template:
          text: "请告诉我流程单号。"
        next: query_flow_status

      - id: query_flow_status
        type: action
        action: action_query_flow_status
        next: show_flow_status

      - id: show_flow_status
        type: response
        template:
          text: "流程{{ slots.flow_number }}
          当前状态是：{{ slots.flow_status }}。
          {{ slots.flow_summary }}"
        next: end

      - id: end
        type: end
        next: []

  approval_progress:
    name: 审批进度查询
    description: 帮用户查询流程的审批进度、当前审批节点和审批人信息。
    steps:
      - id: start
        type: start
        next: ask_flow_number

      - id: ask_flow_number
        type: collect
        slot_name: flow_number
        template:
          text: "请告诉我流程单号。"
        next: query_approval_progress

      - id: query_approval_progress
        type: action
        action: action_query_approval_progress
        next: show_approval_progress

      - id: show_approval_progress
        type: response
        template:
          text: "流程{{ slots.flow_number }}
          当前审批节点是{{ slots.node_name }}，
          审批人是{{ slots.approver }}。
          当前进度：{{ slots.approval_progress }}。"
        next: end

      - id: end
        type: end
        next: []

  leave_request:
    name: 请假申请
    description: 帮用户发起简单的请假申请，收集请假事由和请假天数。
    steps:
      - id: start
        type: start
        next: ask_leave_reason

      - id: ask_leave_reason
        type: collect
        slot_name: leave_reason
        template:
          text: "请简单说明一下请假事由。"
        next: ask_leave_days

      - id: ask_leave_days
        type: collect
        slot_name: leave_days
        template:
          text: "请告诉我请假天数。"
        next: leave_submitted

      - id: leave_submitted
        type: response
        template:
          text: "好的，你的请假申请已提交，事由是：{{ slots.leave_reason }}，请假{{ slots.leave_days }}天。后续会尽快为你处理。"
        next: end

      - id: end
        type: end
        next: []

  seal_request:
    name: 用章申请
    description: 基于当前表单发起用章申请。当前版本先保留流程入口，具体用章能力后续接入。
    steps:
      - id: start
        type: start
        next:
          - if: "slots.get('form_id')"
            then: respond
          - else: missing_form_context

      - id: missing_form_context
        type: response
        template:
          text: "请先选择一个表单，再继续发起用章申请。"
        next: end

      - id: respond
        type: action
        action: action_submit_seal_request
        next: show_seal_result

      - id: show_seal_result
        type: response
        template:
          text: "{{ slots.seal_result }}"
        next: end

      - id: end
        type: end
        next: []

  admin_handoff:
    name: 转人工支持
    description: 将当前对话转交给行政或 IT 支持人员处理。
    steps:
      - id: start
        type: start
        next: respond

      - id: respond
        type: response
        template:
          text: "好的，我来为你转接行政 / IT 支持人员，请稍等。"
        next: end

      - id: end
        type: end
        next: []
